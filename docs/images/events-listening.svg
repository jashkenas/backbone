<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="450" height="834" viewBox="0 0 450 834" role="img" aria-labelledby="title description">
  <title id="title">Backbone.Events listener and listenee bookkeeping</title>
  <desc id="description">A listener and a listenee each hold a reference to one shared Listening record, and the record holds references back to both of them. Each handler stored on the listenee has callback, context, ctx and listening properties, and its listening property points to that record, so that unbinding the last handler removes the record from both objects' maps.</desc>
  <defs>
    <marker id="arrow" markerWidth="2.5" markerHeight="2.1" refX="0" refY="1.05" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,2.1 L2.5,1.05 z" fill="#5c8bee"/>
    </marker>
    <style>
      @font-face { font-family: 'aller-light'; font-style: normal; font-weight: 400; src: url(data:font/woff;base64,) format('woff'); }
      @font-face { font-family: 'aller-bold'; font-style: normal; font-weight: 700; src: url(data:font/woff;base64,) format('woff'); }
      .box { fill: #ffffff; stroke: #5c8bee; stroke-width: 4; }
      .record { fill: #bed1f8; stroke: #5c8bee; stroke-width: 4; }
      .title { fill: #231f20; font: 700 19px 'aller-bold', 'Trebuchet MS', Helvetica, Arial, sans-serif; }
      .note { fill: #44525f; font: 400 15px 'aller-light', 'Trebuchet MS', Helvetica, Arial, sans-serif; }
      .code { fill: #231f20; font: 14px Menlo, Monaco, Consolas, "Lucida Console", monospace; }
      .link { fill: none; stroke: #5c8bee; stroke-width: 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="14" y="16" width="386" height="120" rx="10"/>
  <text class="title" x="36" y="54">Listener</text>
  <text class="note" x="36" y="78">calls listenTo / stopListening</text>
  <text class="code" x="36" y="110">_listeningTo[listenee._listenId]</text>

  <rect class="record" x="14" y="216" width="386" height="150" rx="10"/>
  <text class="title" x="36" y="254">Listening record</text>
  <text class="note" x="36" y="278">one shared record per object pair</text>
  <text class="code" x="36" y="312">listener</text>
  <text class="code" x="230" y="312">obj</text>
  <text class="code" x="36" y="340">count</text>
  <text class="code" x="230" y="340">interop</text>

  <rect class="box" x="14" y="446" width="386" height="150" rx="10"/>
  <text class="title" x="36" y="484">Listenee</text>
  <text class="note" x="36" y="508">calls on / off, emits the event</text>
  <text class="code" x="36" y="540">_listeners[listener._listenId]</text>
  <text class="code" x="36" y="570">_events[name]</text>

  <rect class="record" x="14" y="668" width="386" height="150" rx="10"/>
  <text class="title" x="36" y="706">Event handler</text>
  <text class="note" x="36" y="730">one handler per callback per event</text>
  <text class="code" x="36" y="764">callback</text>
  <text class="code" x="230" y="764">context</text>
  <text class="code" x="36" y="792">ctx</text>
  <text class="code" x="230" y="792">listening</text>

  <path class="link" d="M110 136 L110 203.5"/>
  <text class="code" x="124" y="181">_listeningTo</text>
  <path class="link" d="M272 216 L272 148.5"/>
  <text class="code" x="286" y="181">listener</text>
  <path class="link" d="M110 366 L110 433.5"/>
  <text class="code" x="124" y="411">obj</text>
  <path class="link" d="M272 446 L272 378.5"/>
  <text class="code" x="286" y="411">_listeners</text>
  <path class="link" d="M190 596 L190 655.5"/>
  <text class="code" x="204" y="637">_events</text>

  <path class="link" d="M400 736 H414 Q428 736 428 722 V314 Q428 300 414 300"/>
  <text class="code" x="414" y="637" text-anchor="end">listening</text>
</svg>
